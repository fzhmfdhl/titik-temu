<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daftar Ulang – Titik Temu</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#1c1c24;--mut:#6b6f7b;--blue:#1a7c6f;--line:#e3e5ea;--card:#f6f7fb;--ghost:#d9d9dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Poppins,system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px 60px}
h1{color:var(--blue);font-size:28px;margin:0;font-weight:700}
.sub{color:var(--mut);font-size:13px;margin:2px 0 0}
.ghost{font-size:clamp(56px,14vw,120px);color:var(--ghost);font-weight:500;line-height:1;margin:18px 0 10px;letter-spacing:-2px}
.intro{max-width:560px;color:var(--mut);font-size:13px}
.tabs{display:flex;gap:8px;margin:22px 0 6px}
.tab{border:1px solid var(--line);background:none;color:var(--fg);padding:8px 14px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.sec{display:flex;align-items:center;gap:10px;margin:30px 0 8px;color:var(--blue);font-size:22px;font-weight:700}
.sec i{font-style:normal;font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:600;color:var(--blue);margin-bottom:3px}
input,select,textarea{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;padding:7px 2px;border-radius:0}
textarea{resize:vertical;min-height:70px;border:1px solid var(--line);padding:8px;border-radius:6px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;align-items:center;gap:6px;color:var(--fg);font-weight:500;border:1px solid var(--line);padding:6px 12px;border-radius:999px;margin:0;cursor:pointer}
.chk input{width:auto}
.photo{display:flex;gap:14px;align-items:center}
.photo img{width:84px;height:104px;object-fit:cover;background:var(--card);border-radius:4px}
button.p{background:var(--blue);color:#fff;border:0;padding:12px 22px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
button.s{background:none;border:1px solid var(--blue);color:var(--blue);padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.msg{margin-top:14px;padding:12px;border-radius:8px;background:var(--card);font-size:13px}
.row{border-bottom:1px solid var(--line);padding:12px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row b{color:var(--blue)}
.hide{display:none}
@media(max-width:600px){.grid{grid-template-columns:1fr}}

:root{--pg:#f5f5f5;--cd:#fff;--ft:#f5f5f5;--gr:#7ed321;--rd:#e04a4a;--ib:#c9c9cf}
body{background:var(--pg)}.wrap{max-width:660px}
h1.ttl{color:var(--fg);text-align:center;font-size:30px;margin:14px 0 8px}.c{text-align:center}
.card{display:none;background:var(--cd);border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.12);margin:18px 0;overflow:hidden}.card.on{display:block}
.cb{padding:26px 28px 30px}.ch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.ch h3{margin:0;font-size:20px;font-weight:500;color:var(--fg)}.ast{color:var(--rd);font-size:44px;line-height:.8;font-weight:700}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g1{display:grid;gap:14px}
.card input:not([type=checkbox]):not([type=file]),.card select,.card textarea{border:1px solid var(--ib);border-radius:3px;padding:10px 12px;font-size:13px;background:transparent}
.card textarea{min-height:80px}
.cf{background:var(--ft);padding:12px 28px;display:flex;justify-content:space-between;align-items:center}
.cf button{border-radius:999px;font:inherit;font-weight:600;cursor:pointer;padding:9px 26px}
.nx,.cf .p{background:var(--gr);border:2px solid var(--gr);color:#fff}
.pv{background:none;border:2px solid #a8a8ae;color:var(--mut)}
.bad{border-color:var(--rd)!important}
@media(max-width:600px){.g{grid-template-columns:1fr}.cb{padding:22px 18px}.cf{padding:12px 18px}}
.bad{outline:2px solid var(--rd);outline-offset:1px;border-radius:4px}
:root{color-scheme:light}
.wrap{max-width:440px;padding:20px 14px 50px}
.g{grid-template-columns:1fr}
.card input:not([type=checkbox]):not([type=file]),.card select,.card textarea{font-size:16px;padding:12px}
.cb{padding:22px 18px}.cf{padding:12px 18px}.cf button{min-height:44px;padding:11px 28px;font-size:15px}
h1.ttl{font-size:26px}.ast{font-size:38px}.row{flex-direction:column;align-items:flex-start}
.tabs{justify-content:center}

body{background:#eadfc8}
.wrap{max-width:440px;padding:0;background:#fff;min-height:100vh;box-shadow:0 0 40px rgba(60,20,120,.18);overflow:hidden}

.card input:not([type=checkbox]):not([type=file]),.card select,.card textarea{background:#f8f2e4;border:1px solid transparent;border-radius:12px;padding:14px;color:#2b2118}

.logo{width:112px;height:auto;display:block;margin:2px auto 0}
.nx,.cf .p{background:#1a7c6f}.ast{color:#d16439}
.hero{padding:0;position:relative;aspect-ratio:440/290;background:#f5edda}
.hero .bg{width:100%;height:100%;object-fit:cover;object-position:62% 30%;display:block}
.bt{position:absolute;left:18px;top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;align-items:center;gap:8px;color:#1a7c6f}.bt img{width:40px;height:auto}.bt b{font-size:16px}
.sheet h1.ttl{color:#1a7c6f;font-size:21px;text-align:left;margin:0 0 2px}.sheet .hs{color:#8a7a66;font-size:12px;margin:0 0 18px;opacity:1}

function pageHtml(d){
 const R=(a,v)=>v?`<div style="display:flex;border-bottom:1px solid #e2d6bd;padding:9px 0"><div style="width:160px;color:#8a7a66;font-size:13px">${a}</div><div style="flex:1;font-size:13px;white-space:pre-wrap;color:#2b2118">${esc(v)}</div></div>`:'';
 const I='<svg width="30" height="30" viewBox="0 0 30 30"><path d="M3 15h14M12 8l7 7-7 7" stroke="#d16439" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 5v20" stroke="#d16439" stroke-width="3" stroke-linecap="round"/></svg>';
 const S=(t,rows,x)=>`<div style="display:flex;margin-top:26px"><div style="width:130px;padding-top:6px">${I}${x||''}</div><div style="flex:1"><div style="font-size:24px;font-weight:600;color:#1a7c6f;margin-bottom:6px">${t}</div>${rows}</div></div>`;
 return `<div style="font-family:Poppins,sans-serif;color:#2b2118;padding:44px 60px 50px;position:relative;box-sizing:border-box;width:794px">
 <div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="font-size:32px;font-weight:600;color:#1a7c6f;max-width:430px;line-height:1.2">${esc(d.nama)}</div>
 <div style="display:flex;gap:12px;align-items:flex-start;text-align:right"><div style="font-size:12px;line-height:1.6"><b style="color:#d16439">Anggota Titik Temu</b><br>${esc(d.wa)}<br>${esc(d.email)}<br>${esc(d.ig)}</div><img src="${LOGO}" style="width:62px;height:auto"></div></div>
 <div style="display:flex;margin-top:26px;align-items:flex-start"><div style="width:130px;padding-top:6px">${d.foto?`<img src="${d.foto}" style="display:block;width:108px;height:136px;object-fit:cover;border-radius:4px">`:''}</div><div style="flex:1"><div style="font-size:70px;font-weight:500;color:#e6dabf;letter-spacing:-2px;line-height:1.05;margin-left:-3px;white-space:nowrap">Daftar Ulang</div>
 <div style="margin-top:8px;font-size:12px;color:#6b5d4a;max-width:470px">Formulir daftar ulang keanggotaan komunitas Titik Temu, bergerak di bidang sosial, pendidikan, lingkungan, dan kepemudaan.</div></div></div>
 ${S('Data Diri',R('Panggilan',d.panggil)+R('Tempat, tgl lahir',d.ttl)+R('Jenis kelamin',d.jk)+R('Domisili',d.alamat))}
 ${S('Pendidikan &amp; Pekerjaan',R('Status',d.status)+R('Instansi',d.instansi)+R('Jurusan / jabatan',d.jurusan))}
 ${S('Minat &amp; Peran',R('Bidang',(d.bidang||[]).join(', '))+R('Peran',d.peran)+R('Ketersediaan',d.waktu)+R('Keterampilan',d.skill)+R('Pengalaman',d.peng)+R('Alasan bergabung',d.alasan))}
 <div style="margin:26px 0 0 130px;font-size:11px;color:#a89a82">Titik Temu \u00b7 ${esc(d.tgl||'')}</div>
 
 </div>`}
async function savePdf(d,all){
 await ld('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js','jspdf');
 await ld('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js','html2canvas');
 if(!window.jspdf||!window.html2canvas){alert('Gagal memuat pembuat PDF. Coba lagi.');return}
 await Promise.all([400,500,600,700].map(w=>document.fonts.load(w+' 16px Poppins')));
 const list=all||[d],doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),H=1123*2;let first=true;
 for(const m of list){
  const el=document.createElement('div');el.style.cssText='position:fixed;left:-9999px;top:0;width:794px;background:#f5edda';el.innerHTML=pageHtml(m);document.body.appendChild(el);
  await new Promise(r=>setTimeout(r,150));
  el.style.height=Math.max(1,Math.ceil(el.scrollHeight/1123))*1123+'px';
  const c=await window.html2canvas(el,{scale:2,backgroundColor:'#f5edda',useCORS:true});el.remove();
  const n=Math.ceil(c.height/H);
  for(let i=0;i<n;i++){const s=document.createElement('canvas');s.width=c.width;s.height=H;const x=s.getContext('2d');x.fillStyle='#f5edda';x.fillRect(0,0,s.width,H);const h=Math.min(H,c.height-i*H);x.drawImage(c,0,i*H,c.width,h,0,0,c.width,h);if(!first)doc.addPage();first=false;doc.addImage(s.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297)}
 }
 await save(all?'pendaftar-titik-temu.pdf':'daftar-ulang-'+(list[0].nama||'anggota').replace(/\s+/g,'-').toLowerCase()+'.pdf',doc.output('blob'));
}
$('ph').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=260;c.height=320;const x=c.getContext('2d');x.filter='grayscale(1)';const s=Math.max(260/im.width,320/im.height);x.drawImage(im,(260-im.width*s)/2,(320-im.height*s)/2,im.width*s,im.height*s);foto=c.toDataURL('image/jpeg',.55);$('pv').src=foto};im.src=URL.createObjectURL(f)};

$('kirim').onclick=async()=>{
 const d={foto,tgl:new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})};
 fields.forEach(k=>d[k]=$(k).value.trim());
 d.bidang=[...document.querySelectorAll('#bid input:checked')].map(i=>i.value);
 const m=$('msg');m.classList.remove('hide');
 for(let i=0;i<REQ.length;i++){if(!chk(i)){go(i);alert('Semua kolom wajib diisi. Lengkapi bagian yang ditandai merah.');return}}
 d.ts=Date.now();
 let ok=false;
 if(SCRIPT_URL.startsWith('http')){try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(d)});ok=true}catch(e){}}
 m.innerHTML=ok?'Terima kasih, data kamu sudah terkirim ke admin Titik Temu. ✔':'Data belum bisa dikirim ke admin dari tampilan ini. Unduh salinanmu lalu kirim ke admin.';
 const b=document.createElement('button');b.className='s';b.style.marginLeft='8px';b.textContent='Unduh salinan saya';b.onclick=()=>savePdf(d);m.appendChild(b);
};

$('tF').onclick=()=>{$('vF').classList.remove('hide');$('vA').classList.add('hide');$('tF').classList.add('on');$('tA').classList.remove('on')};
$('tA').onclick=()=>{$('vA').classList.remove('hide');$('vF').classList.add('hide');$('tA').classList.add('on');$('tF').classList.remove('on')};

function render(){
 $('cnt').textContent=rows.length+' pendaftar';
 const L=$('list');L.innerHTML=rows.length?'':'<p class="sub">Belum ada pendaftar.</p>';
 rows.forEach((d,i)=>{const w=document.createElement('div');w.className='row';
  w.innerHTML=`<div><b>${esc(d.nama)}</b><br><span class="sub">${esc(d.wa)} · ${esc((d.bidang||[]).join(', '))} · ${esc(d.tgl||'')}</span></div>`;
  const b=document.createElement('button');b.className='s';b.textContent='Unduh formulir';
  b.onclick=()=>savePdf(d);
  w.appendChild(b);L.appendChild(w)});
}
$('csv').onclick=async()=>{const h=[...fields,'bidang','tgl'];
 const q=v=>'"'+String(Array.isArray(v)?v.join('; '):(v??'')).replace(/"/g,'""')+'"';
 const t=[h.join(',')].concat(rows.map(d=>h.map(k=>q(d[k])).join(','))).join('\n');
 if(!dl)return;try{await dl.save({filename:'pendaftar-titik-temu.csv',data:new Blob([t],{type:'text/csv'})})}catch(e){}};

let st=0;const cards=[...document.querySelectorAll('.card')];
function go(n){st=n;cards.forEach((c,i)=>c.classList.toggle('on',i===n));$('stp').textContent='Langkah '+(n+1)+' dari '+cards.length;if(n)window.scrollTo(0,0)}
const REQ=[['nama','panggil'],['ph','ttl','jk'],['wa','email','ig'],['alamat'],['status','instansi','jurusan'],['bid','peran','waktu'],['skill','peng','alasan','setuju']];
function isBad(id){if(id==='ph')return !foto;if(id==='bid')return !document.querySelector('#bid input:checked');if(id==='setuju')return !$('setuju').checked;return !$(id).value.trim()}
function chk(n){let f=null;REQ[n].forEach(id=>{const e=$(id),b=isBad(id);e.classList.toggle('bad',b);if(b&&!f)f=e});if(f&&f.focus)f.focus();return !f}
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const k=+b.dataset.n;if(k>0&&!chk(st))return;go(st+k)});
$('csv').onclick=()=>{if(rows.length)savePdf(null,rows)};
document.querySelectorAll('.card input:not([type=checkbox]):not([type=file]),.card select,.card textarea').forEach(el=>{const sel=el.tagName==='SELECT',t=sel?el.options[0].text:el.placeholder,w=document.createElement('div'),l=document.createElement('label');w.className='f';l.textContent=t;el.parentNode.insertBefore(w,el);w.append(l,el);if(sel)el.options[0].text='Pilih';else el.placeholder=''});
$('lg').src=LOGO;let tp=0,tt=null;$('sk').onclick=()=>{tp++;clearTimeout(tt);tt=setTimeout(()=>{tp=0},2000);if(tp>=5){tp=0;location.hash='admin'}};
go(0);
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbyoLy4qz2mxCdgP7_m5aIsxh9QMC62-ZVqIumo2RrJQ_tCMVJ_IN-nZFATe8vs8WfVg/exec';
let adminKey=null;
dl={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}};
async function openAdmin(){
 if(!adminKey)adminKey=prompt('Kode admin:');
 if(!adminKey){location.hash='';return}
 try{const r=await fetch(SCRIPT_URL+'?key='+encodeURIComponent(adminKey));const j=await r.json();if(!j.ok)throw 0;
  rows=j.rows.sort((a,b)=>(b.ts||0)-(a.ts||0));$('tA').click();render()}
 catch(e){adminKey=null;alert('Kode salah atau data tidak bisa dimuat.');location.hash=''}}
const rt=()=>{if(location.hash==='#admin')openAdmin();else $('tF').click()};
addEventListener('hashchange',rt);rt();
</script></body></html>
